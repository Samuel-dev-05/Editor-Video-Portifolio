<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato — Samuel Adil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#100e14;
    --panel:#1b1720;
    --line:#2b2532;
    --text:#ece9e2;
    --text-dim:#8c8891;
    --accent:#e8402c;
    --accent-2:#3fbfa6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:32px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 15% 0%, rgba(107,58,163,0.20), transparent 60%),
      radial-gradient(ellipse 700px 500px at 85% 30%, rgba(76,32,120,0.16), transparent 55%),
      var(--bg);
  }
  .contact-page{width:min(620px,100%);}
  .eyebrow{
    margin-bottom:18px;
    color:var(--accent-2);
    font:500 12px 'IBM Plex Mono',monospace;
    letter-spacing:2px;
    text-transform:uppercase;
  }
  h1{
    margin-bottom:14px;
    font:normal clamp(48px,10vw,84px)/.9 'Bebas Neue',sans-serif;
    letter-spacing:1px;
  }
  .intro{max-width:500px;margin-bottom:34px;color:var(--text-dim);line-height:1.6;}
  .options{display:grid;gap:12px;}
  .option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:22px 24px;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--line);
    transition:border-color .2s ease,transform .2s ease;
  }
  .option:hover,.option:focus-visible{border-color:var(--accent);transform:translateX(4px);outline:none;}
  .option strong{display:block;margin-bottom:5px;font-size:16px;}
  .option span{color:var(--text-dim);font-size:13px;}
  .arrow{color:var(--accent);font:20px 'IBM Plex Mono',monospace;}
  .back{display:inline-block;margin-top:28px;color:var(--text-dim);font:12px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:1px;}
  .back:hover,.back:focus-visible{color:var(--accent-2);outline:none;}
</style>
</head>
<body>
  <main class="contact-page">
    <p class="eyebrow">CONTATO // PRÓXIMO PASSO</p>
    <h1>Vamos começar.</h1>
    <p class="intro">Escolha por onde prefere falar comigo sobre seu projeto de edição de vídeo.</p>
    <div class="options">
      <a class="option" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=samsdl06@gmail.com&amp;su=Vamos%20come%C3%A7ar%20um%20projeto&amp;body=Ol%C3%A1%20Samuel%2C%20gostaria%20de%20falar%20sobre%20um%20projeto%20de%20edi%C3%A7%C3%A3o%20de%20v%C3%ADdeo." target="_blank" rel="noopener">
        <span><strong>Enviar e-mail</strong><span>samsdl06@gmail.com</span></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="option" href="https://www.instagram.com/and4gi/" target="_blank" rel="noopener">
        <span><strong>Falar pelo Instagram</strong><span>@and4gi</span></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </div>
    <a class="back" href="samuel-adil-portfolio.html">← Voltar ao portfólio</a>
  </main>
</body>
</html>
